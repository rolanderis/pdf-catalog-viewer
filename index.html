
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parking Lifts Product Catalogue | Hidrotiltai</title>

<style>
:root {
  --ht-bg: rgb(36, 40, 52);
  --ht-blue: #2a7de1;
  --ht-light-blue: #4fb3f6;
  --ht-white: #ffffff;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: var(--ht-bg);
  color: var(--ht-white);
  font-family: Lato, Arial, sans-serif;
}

html {
  scrollbar-width: none;
  -ms-overflow-style: none;
}

body {
  overflow-x: hidden;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

/* HIDE PAGE SCROLLBARS */
html::-webkit-scrollbar,
body::-webkit-scrollbar {
  display: none;
  width: 0;
  height: 0;
}

/* MAIN VIEWER */
.viewer {
  width: 100%;
  min-height: 100vh;
  background: var(--ht-bg);
}

/* HEADER */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
  padding: 12px 18px;
  background: var(--ht-bg);
  border-bottom: 1px solid rgba(255,255,255,0.12);
}

.toolbar-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.toolbar-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.ht-button {
  display: inline-block;
  padding: 10px 14px;
  color: #ffffff;
  background: linear-gradient(145deg, #1b1b1b, #242424);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 5px;
  text-decoration: none;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.4px;
  transition: background 0.25s ease;
}

.ht-button:hover {
  background: var(--ht-blue);
}

/* PDF VIEWER */
#pdf-container {
  display: block;
  width: 100%;
  min-height: calc(100vh - 55px);
  padding: 0;
  margin: 0;
  overflow: visible;
  background: var(--ht-bg);
  text-align: center;

  /* Hide scrollbar but retain scrolling */
  scrollbar-width: none;
  -ms-overflow-style: none;
}

/* HIDE PDF CONTAINER SCROLLBAR */
#pdf-container::-webkit-scrollbar {
  display: none;
  width: 0;
  height: 0;
}

/* EACH PDF PAGE */
.pdf-page {
  display: block;
  margin: 0 auto 12px;
  padding: 0;
  max-width: 100%;
  height: auto;
  background: #ffffff;
}

/* STATUS MESSAGE */
#status {
  max-width: 760px;
  margin: 0 auto;
  padding: 35px 20px;
  color: #ffffff;
  font-size: 14px;
  line-height: 1.7;
}

#status a {
  color: var(--ht-light-blue);
}

/* MOBILE */
@media (max-width: 600px) {
  .toolbar {
    align-items: flex-start;
    flex-direction: column;
    padding: 12px;
  }

  .toolbar-title {
    font-size: 13px;
  }

  .toolbar-actions {
    width: 100%;
  }

  .ht-button {
    text-align: center;
  }

  #pdf-container {
    min-height: calc(100vh - 100px);
  }
}
</style>
</head>

<body>
<div class="viewer">

  <header class="toolbar">
    <div class="toolbar-title">
      PARKING LIFTS PRODUCT CATALOGUE
    </div>

    <div class="toolbar-actions">
      <a
        class="ht-button"
        href="./parking-lifts-catalogue.pdf"
        target="_blank"
        rel="noopener noreferrer">
        ORIGINAL VIEW
      </a>

      <a
        class="ht-button"
        href="./parking-lifts-catalogue.pdf"
        download="parking-lifts-catalogue.pdf">
        DOWNLOAD PDF
      </a>
    </div>
  </header>

  <main id="pdf-container">
    <div id="status">Loading catalogue...</div>
  </main>

</div>

<script type="module">
import * as pdfjsLib from
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

const PDF_URL = "./parking-lifts-catalogue.pdf";

const container = document.getElementById("pdf-container");
const status = document.getElementById("status");

async function loadCatalogue() {
  try {
    const pdf = await pdfjsLib.getDocument(PDF_URL).promise;

    status.remove();

    for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
      const page = await pdf.getPage(pageNumber);
      const baseViewport = page.getViewport({ scale: 1 });

      const availableWidth = Math.max(
        280,
        container.clientWidth - 24
      );

      const scale = availableWidth / baseViewport.width;
      const viewport = page.getViewport({ scale });

      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");

      canvas.className = "pdf-page";
      canvas.width = Math.floor(viewport.width * pixelRatio);
      canvas.height = Math.floor(viewport.height * pixelRatio);
      canvas.style.width = Math.floor(viewport.width) + "px";
      canvas.style.height = Math.floor(viewport.height) + "px";

      container.appendChild(canvas);

      await page.render({
        canvasContext: context,
        viewport: viewport,
        transform: pixelRatio !== 1
          ? [pixelRatio, 0, 0, pixelRatio, 0, 0]
          : null
      }).promise;
    }

  } catch (error) {
    console.error("PDF loading error:", error);

    status.innerHTML =
      'The catalogue could not be loaded. ' +
      'Please check that <strong>parking-lifts-catalogue.pdf</strong> ' +
      'exists in the repository root and that PDF.js can be loaded. ' +
      '<br><br><a href="./parking-lifts-catalogue.pdf" target="_blank" ' +
      'rel="noopener noreferrer">Open the PDF file directly</a>.';
  }
}

loadCatalogue();
</script>
</body>
</html>
