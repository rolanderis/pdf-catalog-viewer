
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hidrotiltai PDF Catalogue Viewer</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: rgb(36, 40, 52);
  color: #ffffff;
  font-family: Arial, sans-serif;
}

body {
  padding: 0;
}

.pdf-viewer {
  width: 100%;
  min-height: 100vh;
  background: rgb(36, 40, 52);
}

.toolbar {
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 16px;
  background: rgb(36, 40, 52);
  border-bottom: 1px solid rgba(255,255,255,0.12);
}

.toolbar-title {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.3px;
}

.toolbar-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.toolbar a,
.toolbar button {
  color: #ffffff;
  background: #242424;
  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 4px;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
}

.toolbar a:hover,
.toolbar button:hover {
  background: #2a7de1;
}

#pdf-container {
  width: 100%;
  min-height: calc(100vh - 49px);
  background: rgb(36, 40, 52);
  overflow: auto;
  text-align: center;
}

#pdf-container canvas {
  display: block;
  margin: 0 auto 12px;
  max-width: 100%;
  height: auto;
  box-shadow: 0 4px 16px rgba(0,0,0,0.22);
}

#status {
  padding: 28px 16px;
  color: #ffffff;
  font-size: 14px;
}

@media (max-width: 600px) {
  .toolbar {
    align-items: flex-start;
    flex-direction: column;
  }

  .toolbar-actions {
    width: 100%;
  }
}
</style>
</head>

<body>
<div class="pdf-viewer">

  <header class="toolbar">
    <div class="toolbar-title">
      PARKING LIFTS PRODUCT CATALOGUE
    </div>

    <div class="toolbar-actions">
      <a
        href="https://drive.google.com/file/d/1ZBdsCpvt1fcgDALN-jEE1V_3rC-LE3Vi/preview"
        target="_blank"
        rel="noopener noreferrer">
        ORIGINAL VIEW
      </a>

      <a
        href="https://drive.google.com/uc?export=download&id=1ZBdsCpvt1fcgDALN-jEE1V_3rC-LE3Vi"
        target="_blank"
        rel="noopener noreferrer">
        DOWNLOAD PDF
      </a>
    </div>
  </header>

  <main id="pdf-container">
    <div id="status">Loading catalogue...</div>
  </main>

</div>

<script type="module">
import * as pdfjsLib from
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

const PDF_URL =
  "https://drive.google.com/uc?export=download&id=1ZBdsCpvt1fcgDALN-jEE1V_3rC-LE3Vi";

const container = document.getElementById("pdf-container");
const status = document.getElementById("status");

async function loadCatalogue() {
  try {
    const pdf = await pdfjsLib.getDocument({
      url: PDF_URL,
      withCredentials: false
    }).promise;

    status.remove();

    for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
      const page = await pdf.getPage(pageNumber);
      const baseViewport = page.getViewport({ scale: 1 });

      const availableWidth = Math.max(
        280,
        container.clientWidth - 24
      );

      const scale = availableWidth / baseViewport.width;
      const viewport = page.getViewport({ scale });

      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");

      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      canvas.style.width = viewport.width + "px";
      canvas.style.height = viewport.height + "px";

      container.appendChild(canvas);

      await page.render({
        canvasContext: context,
        viewport: viewport
      }).promise;
    }
  } catch (error) {
    console.error(error);
    status.textContent =
      "The catalogue could not be loaded. Google Drive access or cross-origin restrictions may prevent direct PDF loading.";
  }
}

loadCatalogue();
</script>
</body>
</html>
